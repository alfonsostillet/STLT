name: STLT-VJ app

# Builds and tests the app on every push and pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: windows
            files: |
              app/build/Release/stlt-vj.exe
              app/build/Release/*.dll
          - os: macos-14
            artifact: macos
            files: app/build/stlt-vj.app.zip
          - os: ubuntu-24.04
            artifact: linux
            files: app/build/stlt-vj
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install X11, OpenGL, GTK, ALSA and FFmpeg headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev libxkbcommon-dev libgtk-3-dev libasound2-dev \
            libavformat-dev libavcodec-dev libswscale-dev libswresample-dev libavutil-dev

      # macOS links a small static FFmpeg built from source; it only changes with the script, so it is cached.
      - name: Cache FFmpeg
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg
        if: runner.os == 'macOS'
        run: |
          if [ ! -f "$HOME/ffmpeg/lib/libavcodec.a" ]; then
            FFMPEG_BUILD_DIR="$RUNNER_TEMP/ffmpeg-src" sh app/scripts/build-ffmpeg.sh "$HOME/ffmpeg"
          fi

      - name: Build
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA="-DFFMPEG_ROOT=$HOME/ffmpeg"; fi
          cmake -S app -B app/build -DCMAKE_BUILD_TYPE=Release $EXTRA
          cmake --build app/build --config Release --parallel

      - name: Test the media engine and effects
        run: ctest --test-dir app/build -C Release --output-on-failure

      - name: Zip the macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent app/build/stlt-vj.app app/build/stlt-vj.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: STLT-VJ-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # A tag v* publishes the three builds as a GitHub Release, with the notes in docs/releases/<tag>.md.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack the builds
        run: |
          mkdir -p release
          V="${GITHUB_REF_NAME}"
          (cd artifacts/STLT-VJ-windows && mkdir STLT-VJ && find . -maxdepth 1 -type f -exec mv {} STLT-VJ/ \; && zip -qr "../../release/STLT-VJ-$V-windows.zip" STLT-VJ)
          cp artifacts/STLT-VJ-macos/stlt-vj.app.zip "release/STLT-VJ-$V-macos.zip"
          (cd artifacts/STLT-VJ-linux && mkdir STLT-VJ && mv stlt-vj STLT-VJ/ && chmod +x STLT-VJ/stlt-vj && tar -czf "../../release/STLT-VJ-$V-linux.tar.gz" STLT-VJ)
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          name: STLT-VJ ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: release/*
