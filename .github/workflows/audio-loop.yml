name: audio_test loop (temporary)

# Temporary: runs audio_test a few hundred times on Windows, before and after the fix of the uninitialised channel
# layout in AudioDecoder::Impl::MakeResampler, with crash dumps of any that crash. To be removed once done.
on:
  push:
    branches: [claude/vibrant-meitner-we0ik4]
    paths: [.github/workflows/audio-loop.yml, app/src/media/AudioDecoder.cpp, app/tests/audio_test.cpp]
  workflow_dispatch:

jobs:
  loop:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Collect crash dumps
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\dumps" | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\audio_test.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value "$env:RUNNER_TEMP\dumps" -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -Value 20 -PropertyType DWord -Force | Out-Null

      - name: Build audio_test (fixed)
        run: |
          cmake -S app -B app/build -DCMAKE_BUILD_TYPE=Release
          cmake --build app/build --config Release --target audio_test --parallel

      - name: Run it 400 times (fixed)
        run: |
          cd app/build/Release
          crashes=0
          for i in $(seq 1 400); do
            if ! ./audio_test.exe > out.txt 2>&1; then
              crashes=$((crashes + 1))
              echo "run $i failed; last lines:"; tail -3 out.txt
            fi
          done
          echo "fixed: $crashes of 400 failed"
          echo "FIXED_FAILURES=$crashes" >> "$GITHUB_ENV"

      - name: Build audio_test (before the fix)
        run: |
          git show a265f4a:app/src/media/AudioDecoder.cpp > app/src/media/AudioDecoder.cpp
          cmake --build app/build --config Release --target audio_test --parallel

      - name: Run it 400 times (before the fix)
        run: |
          cd app/build/Release
          crashes=0
          for i in $(seq 1 400); do
            if ! ./audio_test.exe > out.txt 2>&1; then
              crashes=$((crashes + 1))
              echo "run $i failed; last line: $(tail -1 out.txt)"
            fi
          done
          echo "before the fix: $crashes of 400 failed"

      - name: Where the dumps crashed
        if: always()
        shell: pwsh
        run: |
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          $dumps = Get-ChildItem "$env:RUNNER_TEMP\dumps" -Filter *.dmp -ErrorAction SilentlyContinue
          "$($dumps.Count) dump(s)"
          if (Test-Path $cdb) {
            foreach ($d in ($dumps | Select-Object -First 3)) {
              "== $($d.Name)"
              & $cdb -z $d.FullName -y "app\build\Release;srv*$env:RUNNER_TEMP\sym*https://msdl.microsoft.com/download/symbols" -c ".ecxr; kb 20; q" 2>&1 | Select-Object -Last 40
            }
          } else { "no cdb" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-test-dumps
          path: ${{ runner.temp }}/dumps
          if-no-files-found: ignore

      - name: The fixed build never fails
        run: test "$FIXED_FAILURES" = 0
